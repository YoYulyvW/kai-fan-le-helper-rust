[package]
name = "kai-fan-le-helper"
version = "0.1.0"
edition = "2021"
description = "开饭了助手 - Windows 置顶工具（Rust 重构版）"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
