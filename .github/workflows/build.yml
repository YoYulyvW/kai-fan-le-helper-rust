name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show / install toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = "target/release/kai-fan-le-helper.exe"
          if (Test-Path $exe) {
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
            Write-Output "BINARY_SIZE_MB=$mb"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-fan-le-helper-windows
          path: target/release/kai-fan-le-helper.exe
          if-no-files-found: warn
